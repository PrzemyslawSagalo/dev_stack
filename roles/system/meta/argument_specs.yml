---
argument_specs:
  main:
    short_description: System package installation and configuration role
    description:
      - Installs base development tools, runtimes, and packages with strict checksum verification.
    options:
      system_default_pkg_metadata:
        type: dict
        required: true
        description: Centralized package download URLs and SHA256 checksums.
        options:
          antigravity:
            type: dict
            required: true
            description: Package metadata for Antigravity CLI.
            options:
              url:
                type: str
                required: true
                description: Download URL for Antigravity CLI installer script.
              checksum:
                type: str
                required: true
                description: SHA256 checksum for Antigravity CLI installer script.
          aws:
            type: dict
            required: true
            description: Package metadata for AWS CLI.
            options:
              url:
                type: str
                required: true
