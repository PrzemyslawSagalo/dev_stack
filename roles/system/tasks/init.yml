---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_pkg_mgr == "apt"

- name: Ensure basic system utilities are installed
  ansible.builtin.package:
    name:
      - wget
      - zip
      - unzip
      - tar
      - git
      - make
      - tmux
      - jq
      - bash-completion
      - ca-certificates
      - htop
      - attr
      - rsync
    state: present

- name: Ensure .bashrc exists (for appending PATHs)
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.bashrc"
    content: ""
    force: false
    mode: "0644"
  become: false
