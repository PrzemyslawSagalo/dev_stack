---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_pkg_mgr == "apt"

- name: Ensure basic system utilities are installed
  ansible.builtin.package:
    name:
      - curl
      - wget
      - unzip
      - tar
      - git
      - make
      - tmux
      - bash-completion
      - ca-certificates
    state: present
