---
- name: Check if hugo is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/hugo
  register: system_hugo_bin

- name: Download and install Hugo Extended
  when: not system_hugo_bin.stat.exists
  block:
    - name: Download Hugo Extended tarball
      ansible.builtin.get_url:
        url: >-
          https://github.com/gohugoio/hugo/releases/download/v{{
          hugo_version | default('0.168.0') }}/hugo_extended_{{
          hugo_version | default('0.168.0') }}_linux-amd64.tar.gz
        dest: /tmp/hugo.tar.gz
        mode: "0644"
      register: system_hugo_download
      until: system_hugo_download is success
      retries: 3
      delay: 5

    - name: Extract hugo binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/hugo.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - hugo
        mode: "0755"

    - name: Remove hugo temporary tarball
      ansible.builtin.file:
        path: /tmp/hugo.tar.gz
        state: absent

- name: Ensure hugo binary is executable
  ansible.builtin.file:
    path: /usr/local/bin/hugo
    mode: "0755"
