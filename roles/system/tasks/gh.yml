---
- name: Add GitHub CLI repository (Debian)
  ansible.builtin.deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    architectures: amd64
  register: system_gh_repo
  until: system_gh_repo is success
  retries: 3
  delay: 5
  when: ansible_os_family == 'Debian'

- name: Install GitHub CLI (Debian)
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: "{{ system_gh_repo is changed }}"
  when: ansible_os_family == 'Debian'

- name: Add GitHub CLI repo (Amazon Linux)
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/rpm/gh-cli.repo
    dest: /etc/yum.repos.d/gh-cli.repo
    mode: "0644"
  register: system_gh_repo_download
  until: system_gh_repo_download is success
  retries: 3
  delay: 5
  when: ansible_distribution == 'Amazon'

- name: Install GitHub CLI (Amazon Linux)
  ansible.builtin.dnf:
    name: gh
    state: present
  when: ansible_distribution == 'Amazon'
