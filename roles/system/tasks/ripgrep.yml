---
- name: Install ripgrep (Debian)
  ansible.builtin.apt:
    name: ripgrep
    state: present
  when: ansible_os_family == 'Debian'

- name: Install ripgrep (RedHat)
  ansible.builtin.shell: |
    set -eo pipefail
    TAG=$(curl -w '%{url_effective}' -I -L -s -S https://github.com/BurntSushi/ripgrep/releases/latest -o /dev/null | awk -F '/' '{print $NF}')
    LATEST_RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${TAG}/ripgrep-${TAG}-x86_64-unknown-linux-musl.tar.gz"
    LATEST_RG_FILE=$(basename "$LATEST_RG_URL")
    curl -LO "$LATEST_RG_URL"
    tar -xzf "$LATEST_RG_FILE"
    RG_DIR=$(basename "$LATEST_RG_FILE" .tar.gz)
    cp "$RG_DIR"/rg /usr/local/bin/
    rm -rf "$RG_DIR" "$LATEST_RG_FILE"
  args:
    creates: /usr/local/bin/rg
  when: ansible_os_family == 'RedHat'
