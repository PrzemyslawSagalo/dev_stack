---
- name: Install ripgrep (Debian)
  ansible.builtin.apt:
    name: ripgrep
    state: present
  when: ansible_os_family == 'Debian'

- name: Check if ripgrep binary exists (Amazon Linux)
  ansible.builtin.stat:
    path: /usr/local/bin/rg
  register: system_ripgrep_bin
  when: ansible_distribution == 'Amazon'

- name: Download and install ripgrep (Amazon Linux)
  when:
    - ansible_distribution == 'Amazon'
    - not system_ripgrep_bin.stat.exists
  block:
    - name: Download ripgrep tarball
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.ripgrep.url }}"
        dest: /tmp/ripgrep.tar.gz
        checksum: "{{ system_default_pkg_metadata.ripgrep.checksum }}"
        mode: "0644"
      register: system_ripgrep_download
      until: system_ripgrep_download is success
      retries: 3
      delay: 5

    - name: Extract ripgrep binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/ripgrep.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
          - --wildcards
          - "*/rg"
        mode: "0755"

    - name: Remove ripgrep temporary tarball
      ansible.builtin.file:
        path: /tmp/ripgrep.tar.gz
        state: absent
