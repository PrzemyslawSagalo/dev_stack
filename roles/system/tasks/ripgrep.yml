---
- name: Install ripgrep (Debian)
  ansible.builtin.apt:
    name: ripgrep
    state: present
  when: ansible_os_family == 'Debian'

- name: Install ripgrep (Amazon Linux)
  ansible.builtin.unarchive:
    src: >-
      https://github.com/BurntSushi/ripgrep/releases/download/{{
      ripgrep_version | default('14.1.1') }}/ripgrep-{{
      ripgrep_version | default('14.1.1') }}-x86_64-unknown-linux-musl.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/rg"
    mode: "0755"
    creates: /usr/local/bin/rg
  when: ansible_distribution == 'Amazon'
