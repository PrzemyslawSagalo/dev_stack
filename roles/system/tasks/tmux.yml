---
- name: Check installed tmux version
  ansible.builtin.command:
    cmd: tmux -V
  register: system_tmux_version_check
  changed_when: false
  failed_when: false

- name: Install tmux 3.8 from source
  when: system_tmux_version_check.rc != 0 or 'tmux 3.8' not in system_tmux_version_check.stdout
  block:
    - name: Install tmux build dependencies (Debian)
      ansible.builtin.apt:
        name:
          - build-essential
          - libevent-dev
          - libncurses-dev
          - bison
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install tmux build dependencies (Amazon Linux)
      ansible.builtin.dnf:
        name:
          - gcc
          - make
          - libevent-devel
          - ncurses-devel
          - bison
        state: present
      when: ansible_distribution == 'Amazon'

    - name: Download tmux 3.8 source archive
      ansible.builtin.get_url:
        url: https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
        dest: /tmp/tmux-3.8.tar.gz
        mode: "0644"

    - name: Create temporary directory for tmux build
      ansible.builtin.file:
        path: /tmp/tmux-3.8
        state: directory
        mode: "0755"

    - name: Extract tmux 3.8 source archive
      ansible.builtin.unarchive:
        src: /tmp/tmux-3.8.tar.gz
        dest: /tmp/tmux-3.8
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Build and install tmux 3.8
      ansible.builtin.shell: |
        set -euo pipefail
        ./configure --prefix=/usr/local
        make -j"$(nproc)"
        make install
      args:
        chdir: /tmp/tmux-3.8
      changed_when: true

    - name: Clean up tmux build directory and archive
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tmux-3.8
        - /tmp/tmux-3.8.tar.gz
