---
- name: Check installed tmux version
  ansible.builtin.command:
    cmd: tmux -V
  register: system_tmux_version_check
  changed_when: false
  failed_when: false

- name: Install tmux from source
  when: >-
    system_tmux_version_check.rc != 0 or
    ('tmux ' ~ system_default_pkg_versions.tmux) not in system_tmux_version_check.stdout
  block:
    - name: Install tmux build dependencies (Debian)
      ansible.builtin.apt:
        name:
          - build-essential
          - libevent-dev
          - libncurses-dev
          - bison
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install tmux build dependencies (Amazon Linux)
      ansible.builtin.dnf:
        name:
          - gcc
          - make
          - libevent-devel
          - ncurses-devel
          - bison
        state: present
      when: ansible_distribution == 'Amazon'

    - name: Download tmux source archive
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.tmux.url }}"
        dest: /tmp/tmux.tar.gz
        mode: "0644"
      register: system_tmux_download
      until: system_tmux_download is success
      retries: 3
      delay: 5

    - name: Create temporary directory for tmux build
      ansible.builtin.file:
        path: /tmp/tmux
        state: directory
        mode: "0755"

    - name: Extract tmux source archive
      ansible.builtin.unarchive:
        src: /tmp/tmux.tar.gz
        dest: /tmp/tmux
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Build and install tmux
      ansible.builtin.shell: |
        set -euo pipefail
        ./configure --prefix=/usr/local
        make -j"$(nproc)"
        make install
      args:
        chdir: /tmp/tmux
        executable: /bin/bash
      changed_when: true

    - name: Clean up tmux build directory and archive
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tmux
        - /tmp/tmux.tar.gz
