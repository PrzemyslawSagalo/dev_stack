---
- name: Check if GitHub Copilot CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/copilot
  register: system_copilot_bin

- name: Install GitHub Copilot CLI
  when: not system_copilot_bin.stat.exists
  block:
    - name: Download Copilot CLI archive
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.copilot.url }}"
        dest: /tmp/copilot.tgz
        mode: "0644"
      register: system_copilot_download
      until: system_copilot_download is success
      retries: 3
      delay: 5

    - name: Extract Copilot CLI binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/copilot.tgz
        dest: /usr/local/bin
        extra_opts:
          - --strip-components=1
          - package/copilot
        mode: "0755"
        remote_src: true

    - name: Clean up Copilot CLI archive
      ansible.builtin.file:
        path: /tmp/copilot.tgz
        state: absent

- name: Ensure GitHub Copilot CLI binary is executable
  ansible.builtin.file:
    path: /usr/local/bin/copilot
    mode: "0755"
