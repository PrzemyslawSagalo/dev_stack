---
- name: Include ripgrep installation tasks
  ansible.builtin.include_tasks: ripgrep.yml

- name: Install neovim dependencies (Debian)
  ansible.builtin.apt:
    name:
      - exuberant-ctags
      - fuse
      - libfuse2
      - gettext
      - gcc
      - make
      - cmake
    state: present
  when: ansible_os_family == 'Debian'

- name: Install neovim dependencies (Amazon Linux)
  ansible.builtin.dnf:
    name:
      - ctags
      - fuse
      - fuse-libs
      - gettext
      - gcc
      - make
      - cmake
    state: present
  when: ansible_distribution == 'Amazon'

- name: Check if nvm is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  register: system_nvm_file
  become: false

- name: Install nvm
  when: not system_nvm_file.stat.exists
  become: false
  block:
    - name: Download nvm install script
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.nvm.url }}"
        dest: /tmp/nvm-install.sh
        mode: "0755"

    - name: Run nvm install script
      ansible.builtin.command:
        cmd: bash /tmp/nvm-install.sh
      environment:
        PROFILE: /dev/null
      changed_when: true

    - name: Clean up nvm install script
      ansible.builtin.file:
        path: /tmp/nvm-install.sh
        state: absent

- name: Install Node via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install {{ system_default_pkg_versions.node }}
    nvm alias default {{ system_default_pkg_versions.node }}
  args:
    executable: /bin/bash
  changed_when: false
  become: false

- name: Add nvm to user profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - NVM"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    create: true
    mode: "0644"
  become: false

- name: Remove legacy nvm use from bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "nvm use {{ system_default_pkg_versions.node }} > /dev/null"
    state: absent
  become: false

- name: Check if tree-sitter CLI binary is installed
  ansible.builtin.stat:
    path: /usr/local/bin/tree-sitter
  register: system_tree_sitter_bin

- name: Install tree-sitter CLI
  when: not system_tree_sitter_bin.stat.exists
  block:
    - name: Download tree-sitter CLI archive
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.tree_sitter.url }}"
        dest: /tmp/tree-sitter.gz
        mode: "0644"

    - name: Decompress tree-sitter CLI binary
      ansible.builtin.command:
        cmd: gzip -df /tmp/tree-sitter.gz
      changed_when: true

    - name: Install tree-sitter CLI to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/tree-sitter
        dest: /usr/local/bin/tree-sitter
        mode: "0755"
        remote_src: true

    - name: Clean up tree-sitter temporary binary
      ansible.builtin.file:
        path: /tmp/tree-sitter
        state: absent

- name: Check installed Neovim version
  ansible.builtin.command:
    cmd: /usr/local/bin/nvim --version
  register: system_nvim_version_check
  changed_when: false
  failed_when: false

- name: Build and install Neovim from source
  when: >-
    system_nvim_version_check.rc != 0 or
    ('NVIM v' ~ system_default_pkg_versions.nvim) not in system_nvim_version_check.stdout
  block:
    - name: Clone Neovim repository
      ansible.builtin.git:
        repo: https://github.com/neovim/neovim.git
        dest: /tmp/neovim
        version: "v{{ system_default_pkg_versions.nvim }}"
        depth: 1
        force: true

    - name: Compile Neovim
      ansible.builtin.command:
        cmd: make -j "{{ ansible_processor_vcpus | default(2) }}" CMAKE_BUILD_TYPE=RelWithDebInfo
        chdir: /tmp/neovim
      changed_when: true

    - name: Remove stale Neovim runtime files
      ansible.builtin.file:
        path: /usr/local/share/nvim/runtime
        state: absent

    - name: Install Neovim binary
      ansible.builtin.command:
        cmd: make install
        chdir: /tmp/neovim
      changed_when: true

    - name: Clean up Neovim build directory
      ansible.builtin.file:
        path: /tmp/neovim
        state: absent

- name: Check if Luacheck binary is installed
  ansible.builtin.stat:
    path: /usr/local/bin/luacheck
  register: system_luacheck_bin

- name: Download Luacheck binary
  ansible.builtin.get_url:
    url: "{{ system_default_pkg_metadata.luacheck.url }}"
    dest: /usr/local/bin/luacheck
    mode: "0755"
  when: not system_luacheck_bin.stat.exists
