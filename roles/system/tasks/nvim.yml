---
- name: Include ripgrep installation tasks
  ansible.builtin.include_tasks: ripgrep.yml

- name: Install neovim dependencies (Debian)
  ansible.builtin.apt:
    name:
      - exuberant-ctags
      - fuse
      - libfuse2
      - gettext
      - gcc
      - make
      - cmake
    state: present
  when: ansible_os_family == 'Debian'

- name: Install neovim dependencies (RedHat)
  ansible.builtin.dnf:
    name:
      - ctags
      - fuse
      - fuse-libs
      - gettext
      - gcc
      - make
      - cmake
    state: present
  when: ansible_os_family == 'RedHat'

- name: Download nvm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
    dest: /tmp/nvm-install.sh
    mode: "0755"
  become: false

- name: Run nvm install script
  ansible.builtin.command:
    cmd: bash /tmp/nvm-install.sh
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  become: false

- name: Install Node 23 via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install 23
    nvm alias default 23
  args:
    executable: /bin/bash
  changed_when: false
  become: false

- name: Add nvm to bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "nvm use 23 > /dev/null"
    state: present
  become: false

- name: Install tree-sitter CLI (Amazon Linux)
  ansible.builtin.shell: |
    mkdir -p ~/bin
    curl -sL https://github.com/tree-sitter/tree-sitter/releases/download/v0.22.6/tree-sitter-linux-x64.gz -o ~/bin/tree-sitter.gz
    gzip -df ~/bin/tree-sitter.gz
    chmod +x ~/bin/tree-sitter
  args:
    creates: "{{ ansible_env.HOME }}/bin/tree-sitter"
  become: false
  when: ansible_os_family == 'RedHat'

- name: Add tree-sitter to PATH in bashrc (Amazon Linux)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="$HOME/bin:$PATH"'
    state: present
  become: false
  when: ansible_os_family == 'RedHat'

- name: Clone and build Neovim # noqa: command-instead-of-module
  ansible.builtin.shell: |
    rm -rf /tmp/neovim
    git clone https://github.com/neovim/neovim.git /tmp/neovim
    cd /tmp/neovim
    make -j "$(nproc)" CMAKE_BUILD_TYPE=RelWithDebInfo
    make install
    rm -rf /tmp/neovim
  args:
    creates: /usr/local/bin/nvim
