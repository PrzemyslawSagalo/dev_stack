---
- name: Install pyenv build dependencies (Debian)
  ansible.builtin.apt:
    name:
      - build-essential
      - zlib1g-dev
      - libncurses5-dev
      - libgdbm-dev
      - libnss3-dev
      - libssl-dev
      - libreadline-dev
      - libffi-dev
      - libsqlite3-dev
      - libbz2-dev
      - liblzma-dev
    state: present
  when: ansible_os_family == 'Debian'

- name: Install pyenv build dependencies (Amazon Linux)
  ansible.builtin.dnf:
    name:
      - gcc
      - make
      - patch
      - bzip2
      - sqlite
      - tk-devel
      - xz-devel
      - gdbm-libs
      - zlib-devel
      - ncurses-devel
      - gdbm-devel
      - nss-devel
      - openssl-devel
      - readline-devel
      - libffi-devel
      - sqlite-devel
    state: present
  when: ansible_distribution == 'Amazon'

- name: Check if pyenv is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.pyenv/bin/pyenv"
  register: system_pyenv_bin
  become: false

- name: Install pyenv
  when: not system_pyenv_bin.stat.exists
  become: false
  block:
    - name: Download pyenv installer
      ansible.builtin.get_url:
        url: https://pyenv.run
        dest: /tmp/pyenv_install.sh
        mode: "0755"
      register: system_pyenv_download
      until: system_pyenv_download is success
      retries: 3
      delay: 5

    - name: Run pyenv installer
      ansible.builtin.command:
        cmd: bash /tmp/pyenv_install.sh
      changed_when: true

    - name: Clean up pyenv installer script
      ansible.builtin.file:
        path: /tmp/pyenv_install.sh
        state: absent

- name: Add pyenv to user profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - PYENV"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      if [ -d "$PYENV_ROOT/bin" ]; then
        export PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
      fi
    create: true
    mode: "0644"
  become: false

- name: Remove pyenv block from bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - PYENV"
    state: absent
  become: false

- name: Install python versions via pyenv
  ansible.builtin.shell: |
    set -eo pipefail
    export PYENV_ROOT="$HOME/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"
    eval "$(pyenv init -)"
    installed_versions="$(pyenv versions --bare || true)"
    for ver in {{ system_default_pkg_versions.python.installed | join(' ') }}; do
      if [ ! -d "$PYENV_ROOT/versions/$ver" ] && ! echo "$installed_versions" | grep -qx "$ver"; then
        pyenv install -s "$ver"
      fi
    done
    pyenv global {{ system_default_pkg_versions.python.default }}
  args:
    executable: /bin/bash
  changed_when: false
  become: false
