---
- name: Check if OpenShift client binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/oc
  register: system_oc_bin

- name: Download and install OpenShift client
  when: not system_oc_bin.stat.exists
  block:
    - name: Download OpenShift client tarball
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.oc.url }}"
        dest: /tmp/openshift-client-linux.tar.gz
        checksum: "{{ system_default_pkg_metadata.oc.checksum }}"
        mode: "0644"
      register: system_oc_download
      until: system_oc_download is success
      retries: 3
      delay: 5

    - name: Extract OpenShift client binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/openshift-client-linux.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - oc
        mode: "0755"

    - name: Remove OpenShift client temporary tarball
      ansible.builtin.file:
        path: /tmp/openshift-client-linux.tar.gz
        state: absent
