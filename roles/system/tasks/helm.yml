---
- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: system_helm_bin

- name: Install Helm
  when: not system_helm_bin.stat.exists
  block:
    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ system_default_pkg_metadata.helm.url }}"
        dest: /tmp/helm.tar.gz
        checksum: "{{ system_default_pkg_metadata.helm.checksum }}"
        mode: "0644"
      register: system_helm_download
      until: system_helm_download is success
      retries: 3
      delay: 5

    - name: Extract Helm binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
          - "linux-{{ system_arch.deb }}/helm"
        mode: "0755"

    - name: Clean up Helm archive
      ansible.builtin.file:
        path: /tmp/helm.tar.gz
        state: absent

- name: Ensure Helm binary is executable
  ansible.builtin.file:
    path: /usr/local/bin/helm
    mode: "0755"
