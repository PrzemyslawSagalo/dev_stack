---
- name: Download try script
  ansible.builtin.get_url:
    url: "{{ system_default_pkg_metadata.try.url }}"
    dest: /usr/local/bin/try
    checksum: "{{ system_default_pkg_metadata.try.checksum }}"
    mode: "0755"
  register: system_try_download
  until: system_try_download is success
  retries: 3
  delay: 5
