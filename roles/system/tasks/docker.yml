---
- name: Install Docker (Amazon Linux)
  ansible.builtin.dnf:
    name: docker
    state: present
  when: ansible_distribution == 'Amazon'

- name: Add Docker repository (Debian)
  ansible.builtin.deb822_repository:
    name: docker
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    architectures: "{{ system_arch.deb }}"
  register: system_docker_repo
  until: system_docker_repo is success
  retries: 3
  delay: 5
  when: ansible_os_family == 'Debian'

- name: Install Docker (Debian)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ system_docker_repo is changed }}"
  when: ansible_os_family == 'Debian'

- name: Ensure user is in docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Ensure docker-compose plugin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: "0755"
  become: false
  when: ansible_distribution == 'Amazon'

- name: Download docker-compose plugin
  ansible.builtin.get_url:
    url: "{{ system_default_pkg_metadata.docker_compose.url }}"
    dest: "{{ ansible_env.HOME }}/.docker/cli-plugins/docker-compose"
    checksum: "{{ system_default_pkg_metadata.docker_compose.checksum }}"
    mode: "0755"
  register: system_docker_compose_download
  until: system_docker_compose_download is success
  retries: 3
  delay: 5
  become: false
  when: ansible_distribution == 'Amazon'

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'podman', 'containerd']
