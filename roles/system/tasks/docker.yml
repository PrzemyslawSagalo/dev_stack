---
- name: Install Docker (Amazon Linux)
  ansible.builtin.dnf:
    name: docker
    state: present
  when: ansible_distribution == 'Amazon'

- name: Check if Docker binary is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: system_docker_bin

- name: Install Docker via official script (Debian)
  when:
    - ansible_distribution != 'Amazon'
    - not system_docker_bin.stat.exists
  block:
    - name: Download Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Run Docker install script
      ansible.builtin.command:
        cmd: /tmp/get-docker.sh
      changed_when: true

    - name: Clean up Docker install script
      ansible.builtin.file:
        path: /tmp/get-docker.sh
        state: absent

- name: Ensure user is in docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Ensure docker-compose plugin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: "0755"
  become: false

- name: Download docker-compose plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v2.36.0/docker-compose-linux-x86_64"
    dest: "{{ ansible_env.HOME }}/.docker/cli-plugins/docker-compose"
    mode: "0755"
  become: false

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'podman', 'containerd']
