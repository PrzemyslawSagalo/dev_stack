---
system_is_arm64: "{{ ansible_architecture in ['aarch64', 'arm64'] }}"

system_arch:
  is_arm64: "{{ system_is_arm64 }}"
  deb: "{{ 'arm64' if system_is_arm64 else 'amd64' }}"
  uname: "{{ 'aarch64' if system_is_arm64 else 'x86_64' }}"
  x64: "{{ 'arm64' if system_is_arm64 else 'x64' }}"
  ripgrep: "{{ 'aarch64-unknown-linux-gnu' if system_is_arm64 else 'x86_64-unknown-linux-musl' }}"

system_default_pkg_versions:
  aws: "2.40.1"
  bat: "0.26.1"
  copilot: "1.0.105"
  direnv: "2.38.2"
  docker_compose: "2.36.0"
  fd: "10.5.2"
  fzf: "0.75.0"
  go: "1.24.1"
  helm: "3.22.1"
  lazygit: "0.66.1"
  luacheck: "1.0.0"
  node: "23"
  nvim: "0.12.6"
  nvm: "0.40.3"
  pyenv:
    git_repo_commit_hash: "bdd89156f0e591558ca901c5984387dd993157f9"
  python:
    default: "3.13.2"
    installed:
      - "3.13.2"
      - "3.12.9"
      - "3.11.11"
  ripgrep: "14.1.1"
  tmux: "3.8"
  tree_sitter: "0.22.6"
  try: "v0.2.1"
  uv: "0.13.8"
  yq: "4.54.3"
  zoxide: "0.10.0"

