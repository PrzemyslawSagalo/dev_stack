---
- name: Deploy .bash_aliases
  ansible.builtin.copy:
    src: bash/.bash_aliases
    dest: "{{ ansible_env.HOME }}/.bash_aliases"
    mode: "0644"

- name: Ensure ~/.bash_aliases is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "if [ -f ~/.bash_aliases ]; then . ~/.bash_aliases; fi"
    state: present
    create: true
    mode: "0644"

- name: Deploy .tmux.conf
  ansible.builtin.copy:
    src: tmux/.tmux.conf
    dest: "{{ ansible_env.HOME }}/.tmux.conf"
    mode: "0644"

- name: Deploy .copilot directory
  ansible.builtin.copy:
    src: copilot/
    dest: "{{ ansible_env.HOME }}/.copilot/"
    mode: "0644"
    directory_mode: "0755"

- name: Remove legacy .config/copilot directory if present
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/copilot"
    state: absent

- name: Remove legacy mcp-config.json if present
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.copilot/mcp-config.json"
    state: absent

- name: Ensure ~/.gemini/config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.gemini/config"
    state: directory
    mode: "0755"

- name: Symlink Copilot skills to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/skills"
    dest: "{{ ansible_env.HOME }}/.gemini/config/skills"
    state: link
    force: true

- name: Symlink Copilot standards to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/standards"
    dest: "{{ ansible_env.HOME }}/.gemini/config/standards"
    state: link
    force: true

- name: Symlink Copilot agents to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/agents"
    dest: "{{ ansible_env.HOME }}/.gemini/config/agents"
    state: link
    force: true

- name: Symlink Copilot commands to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/commands"
    dest: "{{ ansible_env.HOME }}/.gemini/config/commands"
    state: link
    force: true

- name: Symlink Copilot MCP configuration to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/.mcp.json"
    dest: "{{ ansible_env.HOME }}/.gemini/config/mcp_config.json"
    state: link
    force: true

- name: Configure Maister plugin for Copilot and Antigravity
  ansible.builtin.import_tasks: maister.yml

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Deploy SSH config block from dotfiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/config"
    block: "{{ lookup('ansible.builtin.file', 'ssh/config') }}"
    mode: "0600"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DOTFILES SSH"

- name: Deploy .gitconfig
  ansible.builtin.copy:
    src: git/.gitconfig
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    mode: "0644"
