---
- name: Deploy .bash_aliases
  ansible.builtin.copy:
    src: bash/.bash_aliases
    dest: "{{ ansible_env.HOME }}/.bash_aliases"
    mode: "0644"

- name: Ensure ~/.bash_aliases is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "if [ -f ~/.bash_aliases ]; then . ~/.bash_aliases; fi"
    state: present
    create: true
    mode: "0644"

- name: Ensure ~/.config/bash directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/bash"
    state: directory
    mode: "0755"

- name: Deploy bash/init.sh
  ansible.builtin.copy:
    src: bash/init.sh
    dest: "{{ ansible_env.HOME }}/.config/bash/init.sh"
    mode: "0644"

- name: Ensure ~/.config/bash/init.sh is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "if [ -f ~/.config/bash/init.sh ]; then . ~/.config/bash/init.sh; fi"
    state: present
    create: true
    mode: "0644"

- name: Deploy .tmux.conf
  ansible.builtin.copy:
    src: tmux/.tmux.conf
    dest: "{{ ansible_env.HOME }}/.tmux.conf"
    mode: "0644"

- name: Deploy .copilot directory
  ansible.builtin.copy:
    src: copilot/
    dest: "{{ ansible_env.HOME }}/.copilot/"
    mode: "0644"
    directory_mode: "0755"

- name: Enforce secure permissions on ~/.copilot/mcp-config.json
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.copilot/mcp-config.json"
    mode: "0600"
    state: file

- name: Ensure ~/.gemini/config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.gemini/config"
    state: directory
    mode: "0755"

- name: Symlink Copilot components to Antigravity config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.copilot/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.gemini/config/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: skills, dest: skills }
    - { src: standards, dest: standards }
    - { src: agents, dest: agents }
    - { src: commands, dest: commands }
    - { src: mcp-config.json, dest: mcp_config.json }
    - { src: copilot-instructions.md, dest: GEMINI.md }
    - { src: copilot-instructions.md, dest: AGENTS.md }

- name: Configure Maister plugin for Copilot and Antigravity
  ansible.builtin.import_tasks: maister.yml
  tags: plugins

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Deploy SSH config block from dotfiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/config"
    block: "{{ lookup('ansible.builtin.file', 'ssh/config') }}"
    mode: "0600"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DOTFILES SSH"

- name: Deploy .gitconfig
  ansible.builtin.copy:
    src: git/.gitconfig
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    mode: "0644"
