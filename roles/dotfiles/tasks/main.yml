---
- name: Deploy .bash_aliases
  ansible.builtin.copy:
    src: bash/.bash_aliases
    dest: "{{ ansible_env.HOME }}/.bash_aliases"
    mode: "0644"

- name: Ensure ~/.bash_aliases is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "if [ -f ~/.bash_aliases ]; then . ~/.bash_aliases; fi"
    state: present
    create: true
    mode: "0644"

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config"
    state: directory
    mode: "0755"

- name: Deploy starship.toml configuration
  ansible.builtin.copy:
    src: starship/starship.toml
    dest: "{{ ansible_env.HOME }}/.config/starship.toml"
    mode: "0644"

- name: Ensure ~/.config/bash directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/bash"
    state: directory
    mode: "0755"

- name: Deploy bash/init.sh
  ansible.builtin.copy:
    src: bash/init.sh
    dest: "{{ ansible_env.HOME }}/.config/bash/init.sh"
    mode: "0644"

- name: Ensure ~/.config/bash/init.sh is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "if [ -f ~/.config/bash/init.sh ]; then . ~/.config/bash/init.sh; fi"
    state: present
    create: true
    mode: "0644"

- name: Deploy .tmux.conf
  ansible.builtin.copy:
    src: tmux/.tmux.conf
    dest: "{{ ansible_env.HOME }}/.tmux.conf"
    mode: "0644"

- name: Ensure AI CLI directories exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .copilot
    - .gemini/config
    - .config/opencode

- name: Deploy ~/.config/ai directory
  ansible.builtin.copy:
    src: ai/
    dest: "{{ ansible_env.HOME }}/.config/ai/"
    mode: "0644"
    directory_mode: "0755"

- name: Enforce secure permissions on ~/.config/ai/mcp-config.json
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ai/mcp-config.json"
    mode: "0600"
    state: file

- name: Symlink shared AI configuration to Copilot, Antigravity, and OpenCode
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/ai/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    # GitHub Copilot CLI
    - { src: skills, dest: .copilot/skills }
    - { src: standards, dest: .copilot/standards }
    - { src: agents, dest: .copilot/agents }
    - { src: commands, dest: .copilot/commands }
    - { src: mcp-config.json, dest: .copilot/mcp-config.json }
    - { src: AGENTS.md, dest: .copilot/copilot-instructions.md }
    # Google Antigravity
    - { src: skills, dest: .gemini/config/skills }
    - { src: standards, dest: .gemini/config/standards }
    - { src: agents, dest: .gemini/config/agents }
    - { src: commands, dest: .gemini/config/commands }
    - { src: mcp-config.json, dest: .gemini/config/mcp_config.json }
    - { src: AGENTS.md, dest: .gemini/config/GEMINI.md }
    - { src: AGENTS.md, dest: .gemini/config/AGENTS.md }
    # OpenCode
    - { src: skills, dest: .config/opencode/skills }
    - { src: standards, dest: .config/opencode/standards }
    - { src: agents, dest: .config/opencode/agents }
    - { src: commands, dest: .config/opencode/commands }
    - { src: AGENTS.md, dest: .config/opencode/AGENTS.md }
  loop_control:
    label: "{{ item.dest }} -> ~/.config/ai/{{ item.src }}"

- name: Configure AI tool command permissions
  ansible.builtin.import_tasks: ai_permissions.yml

- name: Configure Maister plugin for Copilot and Antigravity
  ansible.builtin.import_tasks: maister.yml
  tags: plugins

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Deploy SSH config block from dotfiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/config"
    block: "{{ lookup('ansible.builtin.file', 'ssh/config') }}"
    mode: "0600"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DOTFILES SSH"

- name: Deploy .gitconfig
  ansible.builtin.copy:
    src: git/.gitconfig
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    mode: "0644"

- name: Check if ~/.gitconfig.local exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.gitconfig.local"
  register: dotfiles_gitconfig_local

- name: Initialize ~/.gitconfig.local when missing
  when: not dotfiles_gitconfig_local.stat.exists
  block:
    - name: Prompt for local Git user.name
      ansible.builtin.pause:
        prompt: "Git user.name [press Enter for global default: Przemyslaw Sagalo]"
      register: dotfiles_git_name_prompt

    - name: Prompt for local Git user.email
      ansible.builtin.pause:
        prompt: "Git user.email [press Enter to skip]"
      register: dotfiles_git_email_prompt

    - name: Configure local Git user identity in ~/.gitconfig.local
      vars:
        dotfiles_git_user_name: "{{ (dotfiles_git_name_prompt.user_input | default('')) | trim }}"
        dotfiles_git_user_email: "{{ (dotfiles_git_email_prompt.user_input | default('')) | trim }}"
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.gitconfig.local"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - GIT USER IDENTITY"
        block: |-
          [user]
          {% if (dotfiles_git_user_name | length) > 0 %}
          	name = {{ dotfiles_git_user_name }}
          {% endif %}
          {% if (dotfiles_git_user_email | length) > 0 %}
          	email = {{ dotfiles_git_user_email }}
          {% endif %}
      when: (dotfiles_git_user_name | length) > 0 or (dotfiles_git_user_email | length) > 0

- name: Deploy .gitignore_global
  ansible.builtin.copy:
    src: git/.gitignore_global
    dest: "{{ ansible_env.HOME }}/.gitignore_global"
    mode: "0644"
