# Podstawowa konfiguracja tmux
set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 10000

# Zmiana domyślnego prefixu (opcjonalnie, np. na Ctrl-a)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Wygodne przeładowanie konfiguracji
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pionowy i poziomy podział okna (wygodniejsze skróty)
bind | split-window -h
bind - split-window -v
