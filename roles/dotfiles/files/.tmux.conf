# Basic tmux configuration
set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 10000

# Change default prefix (optional, e.g., to Ctrl-a)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vertical and horizontal window split (convenient shortcuts)
bind | split-window -h
bind - split-window -v
