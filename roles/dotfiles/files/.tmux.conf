# Zmiana domyślnego terminala na 256 kolorów
set -g default-terminal "screen-256color"

# Włączenie obsługi myszy (scrollowanie, zmiana rozmiaru okien)
set -g mouse on

# Numerowanie okien i paneli od 1 zamiast 0 (wygodniejsze dla klawiatury)
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Zwiększenie historii scrollowania
set -g history-limit 10000

# Szybkie przeładowanie konfiguracji (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Konfiguracja przeładowana!"
