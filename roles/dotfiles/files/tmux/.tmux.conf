# Standard tmux configuration
set -g default-terminal "tmux-256color"
set -g focus-events on

# Enable 24-bit true color pass-through (required by Neovim termguicolors)
set -as terminal-features ',xterm-256color:RGB'

# Enable mouse mode for scrolling and pane selection
set -g mouse on

# Enable OSC 52 clipboard pass-through to outer terminal (Mac / Windows)
set -s set-clipboard on
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',xterm-256color:clipboard'
set -g allow-passthrough on

# Use vi keys in copy mode and pipe selection to clipboard on drag-end or 'y'
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
