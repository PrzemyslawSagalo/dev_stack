---
- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config"
    state: directory
    mode: "0755"

- name: Check for legacy external git repository in ~/.config/nvim
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/nvim/.git"
  register: nvim_legacy_git_stat

- name: Check for pre-existing legacy backup directory
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/nvim.external-repo.bak"
  register: nvim_backup_stat
  when: nvim_legacy_git_stat.stat.exists

- name: Backup legacy external git repository configuration
  ansible.builtin.command: >-
    mv
    "{{ ansible_env.HOME }}/.config/nvim"
    "{{ ansible_env.HOME }}/.config/nvim.external-repo.bak{{
      '.' ~ (ansible_date_time.epoch | default('collision'))
      if nvim_backup_stat.stat.exists else '' }}"
  when: nvim_legacy_git_stat.stat.exists
  changed_when: true

- name: Deploy Neovim configuration from monorepo
  ansible.builtin.copy:
    src: files/nvim/
    dest: "{{ ansible_env.HOME }}/.config/nvim/"
    mode: preserve
    directory_mode: "0755"

- name: Find installed Neovim configuration files
  ansible.builtin.find:
    paths:
      - "{{ ansible_env.HOME }}/.config/nvim/lua"
      - "{{ ansible_env.HOME }}/.config/nvim/tests"
    file_type: file
    recurse: true
  register: nvim_installed_files

- name: Reconcile removed managed Neovim files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nvim_installed_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: >-
    (item.path | replace(ansible_env.HOME ~ '/.config/nvim/', ''))
    not in (lookup('ansible.builtin.filetree', role_path ~ '/files/nvim/')
    | selectattr('state', 'equalto', 'file')
    | map(attribute='path') | list)
