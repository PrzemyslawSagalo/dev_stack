---
- name: Ensure Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/nvim"
    state: directory
    mode: "0755"

- name: Find source files in Neovim configuration role
  ansible.builtin.find:
    paths: "{{ role_path }}/files/nvim"
    recurse: true
    hidden: true
    file_type: file
  register: nvim_src_files

- name: Find source directories in Neovim configuration role
  ansible.builtin.find:
    paths: "{{ role_path }}/files/nvim"
    recurse: true
    hidden: true
    file_type: directory
  register: nvim_src_dirs

- name: Find target files in Neovim configuration directory
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.config/nvim"
    recurse: true
    hidden: true
    file_type: file
  register: nvim_dest_files

- name: Find target directories in Neovim configuration directory
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.config/nvim"
    recurse: true
    hidden: true
    file_type: directory
  register: nvim_dest_dirs

- name: Remove orphaned files in Neovim configuration directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nvim_dest_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: >
    (item.path | relpath(ansible_env.HOME ~ '/.config/nvim'))
    not in (nvim_src_files.files | map(attribute='path') | map('relpath', role_path ~ '/files/nvim') | list)

- name: Remove orphaned directories in Neovim configuration directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nvim_dest_dirs.files | sort(attribute='path', reverse=true) }}"
  loop_control:
    label: "{{ item.path }}"
  when: >
    (item.path | relpath(ansible_env.HOME ~ '/.config/nvim'))
    not in (nvim_src_dirs.files | map(attribute='path') | map('relpath', role_path ~ '/files/nvim') | list)

- name: Deploy Neovim configuration
  ansible.builtin.copy:
    src: nvim/
    dest: "{{ ansible_env.HOME }}/.config/nvim/"
    mode: preserve
    directory_mode: "0755"
