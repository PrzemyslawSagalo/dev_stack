---
- name: Check legacy Copilot component directories
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.copilot/{{ item }}"
    get_checksum: false
  loop:
    - skills
    - standards
    - agents
    - commands
  register: cleanup_copilot_component_stats
  failed_when: false

- name: Remove legacy non-symlink Copilot component directories
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ cleanup_copilot_component_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat is defined
    - item.stat.exists | default(false)
    - item.stat.isdir | default(false)
    - not (item.stat.islnk | default(false))
  failed_when: false

- name: Remove retired AI skill directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ai/skills/{{ item }}"
    state: absent
  loop:
    - artifact-generator
    - test-standards-discovery
  failed_when: false

- name: Find source entries in Neovim configuration role
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/roles/nvim/files/nvim"
    recurse: true
    hidden: true
    file_type: any
  register: cleanup_nvim_src_entries
  failed_when: false

- name: Find target entries in Neovim configuration directory
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.config/nvim"
    recurse: true
    hidden: true
    file_type: any
  register: cleanup_nvim_dest_entries
  failed_when: false

- name: Remove orphaned entries in Neovim configuration directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (cleanup_nvim_dest_entries.files | default([])) | sort(attribute='path', reverse=true) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - not (cleanup_nvim_src_entries.failed | default(false))
    - (cleanup_nvim_src_entries.files | default([])) | length > 0
    - >-
      (item.path | relpath(ansible_env.HOME ~ '/.config/nvim'))
      not in (
        (cleanup_nvim_src_entries.files | default([]))
        | map(attribute='path')
        | map('relpath', playbook_dir ~ '/roles/nvim/files/nvim')
        | list
      )
      or item.isdir != (
        (cleanup_nvim_src_entries.files | default([]))
        | selectattr('path', 'equalto', playbook_dir ~ '/roles/nvim/files/nvim/' ~ (item.path | relpath(ansible_env.HOME ~ '/.config/nvim')))
        | map(attribute='isdir') | first | default(false)
      )
      or item.isreg != (
        (cleanup_nvim_src_entries.files | default([]))
        | selectattr('path', 'equalto', playbook_dir ~ '/roles/nvim/files/nvim/' ~ (item.path | relpath(ansible_env.HOME ~ '/.config/nvim')))
        | map(attribute='isreg') | first | default(false)
      )
      or item.islnk != (
        (cleanup_nvim_src_entries.files | default([]))
        | selectattr('path', 'equalto', playbook_dir ~ '/roles/nvim/files/nvim/' ~ (item.path | relpath(ansible_env.HOME ~ '/.config/nvim')))
        | map(attribute='islnk') | first | default(false)
      )
  failed_when: false

- name: Remove legacy shadowing Neovim site Treesitter directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/nvim/site/{{ item }}"
    state: absent
  loop:
    - parser
    - queries
  failed_when: false
