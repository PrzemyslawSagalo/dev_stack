---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          with_v: false
          default_bump: patch

      - name: Build package and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          git archive --format=tar.gz -9 -o dev_stack.tar.gz HEAD
          sha256sum dev_stack.tar.gz > dev_stack.tar.gz.sha256
          gh release create "${RELEASE_VERSION}" \
            dev_stack.tar.gz \
            dev_stack.tar.gz.sha256 \
            --title "${RELEASE_VERSION}" \
            --generate-notes \
            --latest
