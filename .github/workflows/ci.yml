---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          pip install --no-cache-dir pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  test_unit:
    name: tests/unit (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized unit tests
        run: ./tests/run.sh unit "${{ matrix.distro }}"

  test_smoke:
    name: tests/smoke (${{ matrix.distro }})
    needs:
      - lint
      - test_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized smoke test
        run: ./tests/run.sh smoke "${{ matrix.distro }}"
