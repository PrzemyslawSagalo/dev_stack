---
name: Ansible CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ansible-lint
      - name: Run ansible-lint
        run: ansible-lint setup.yml || true

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "geerlingguy/docker-ubuntu2204-ansible"
          - "redhat/ubi9-init"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ansible-core molecule molecule-plugins[docker] docker
      - name: Run Molecule tests
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
        run: molecule test
