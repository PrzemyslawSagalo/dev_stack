---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          pip install --no-cache-dir pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  skillspector:
    name: SkillSpector Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SkillSpector
        run: |
          pip install --no-cache-dir "git+https://github.com/NVIDIA/SkillSpector.git@c7958a3268d9498644b22edb75d0f051bbc8cbfc" # v2.12.0

      - name: Scan AI skills & instructions
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          SKILLSPECTOR_PROVIDER: openai_compatible
          SKILLSPECTOR_COMPAT_BASE_URL: https://models.inference.ai.azure.com
          SKILLSPECTOR_COMPAT_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          SKILLSPECTOR_MODEL: gpt-4o
        run: |
          llm_flag=""
          if [ "${IS_FORK_PR}" = "true" ] || [ -z "${SKILLSPECTOR_COMPAT_API_KEY:-}" ]; then
            llm_flag="--no-llm"
          fi
          mkdir -p sarif-results
          # shellcheck disable=SC2086
          skillspector scan roles/dotfiles/files/copilot ${llm_flag} --fail-on-findings --format sarif --output sarif-results/copilot.sarif
          # shellcheck disable=SC2086
          skillspector scan AGENTS.md ${llm_flag} --fail-on-findings --format sarif --output sarif-results/agents.sarif

      - name: Upload Copilot SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('sarif-results/copilot.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: sarif-results/copilot.sarif
          category: skillspector-copilot

      - name: Upload AGENTS.md SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('sarif-results/agents.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: sarif-results/agents.sarif
          category: skillspector-agents

  test_unit:
    name: tests/unit (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized unit tests
        run: ./tests/run.sh unit "${{ matrix.distro }}"

  test_e2e:
    name: tests/e2e (${{ matrix.distro }})
    needs:
      - lint
      - test_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized e2e tests
        run: ./tests/run.sh e2e "${{ matrix.distro }}"

  test_smoke:
    name: tests/smoke (${{ matrix.distro }})
    needs:
      - lint
      - test_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized smoke test
        run: ./tests/run.sh smoke "${{ matrix.distro }}"
