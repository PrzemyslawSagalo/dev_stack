---
name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  test_smoke:
    name: tests/test_smoke (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:22.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run containerized smoke test
        run: ./tests/test_smoke/run_smoke_test.sh "${{ matrix.distro }}"
