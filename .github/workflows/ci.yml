---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          pip install --no-cache-dir pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test_unit:
    name: tests/unit (${{ matrix.distro }})
    needs:
      - lint
      - gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized unit tests
        run: ./tests/run.sh unit "${{ matrix.distro }}"

  test_smoke:
    name: tests/test_smoke (${{ matrix.distro }})
    needs:
      - lint
      - gitleaks
      - test_unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:24.04"
          - "amazonlinux:2023"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run containerized smoke test
        run: ./tests/run.sh smoke "${{ matrix.distro }}"
