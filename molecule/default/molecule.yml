---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "${MOLECULE_DISTRO:-geerlingguy/docker-ubuntu2204-ansible}"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        # Tests run as root inside the container; sudo+PAM is broken on UBI init images.
        ansible_become_method: su
verifier:
  name: ansible
