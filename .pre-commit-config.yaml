repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        language_version: python3

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua-github

  - repo: https://github.com/Calinou/pre-commit-luacheck
    rev: v1.0.0
    hooks:
      - id: luacheck
